[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "shocklink"
version = "0.1.0"
description = "Analyze magnetic field-line connectivity to the bow shock in 3D MHD simulations."
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26",
  "pyspedas>=1.7",
  "pyvista>=0.48",
  "scipy>=1.14.1",
]

[project.urls]
Repository = "https://github.com/yuxi-chen/ShockLink"
Documentation = "https://github.com/yuxi-chen/ShockLink/blob/main/docs/algorithms.md"

[project.optional-dependencies]
mms = [
  "matplotlib>=3.8",
]
test = [
  "nbformat>=5",
  "pytest>=8",
]
notebook = [
  "ipykernel>=6",
  "jupyterlab>=4",
  "nbconvert>=7",
  "nbformat>=5",
]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "nbformat>=5",
  "pytest>=8",
  "ruff>=0.9",
  "twine>=5.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/shocklink"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/data",
  "/.worktrees",
  "/*.executed.ipynb",
  "/*.png",
]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "--import-mode=importlib"]
markers = [
  "integration: tests that use large local simulation data",
]
testpaths = ["tests"]
